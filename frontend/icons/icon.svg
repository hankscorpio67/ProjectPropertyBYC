  <!-- Windows -->
  <rect x="160" y="230" width="50" height="50" rx="4" fill="#2563eb" opacity="0.7"/>
  <rect x="302" y="230" width="50" height="50" rx="4" fill="#2563eb" opacity="0.7"/>
  <!-- AI spark -->
  <circle cx="370" cy="142" r="42" fill="#0f1117"/>
